<!doctype html>
<!--
  Open Bot's way back from a sign-in, for companies that send a browser back only to a web address
  (Google). All it does is hand what the sign-in came back with to the Open Bot app, at
  openbot://sign-in/callback, on a computer or a phone. It keeps nothing, loads nothing and sends
  nothing anywhere else, and the code it hands over is of no use without what the Open Bot server
  kept for that sign-in.

  Host it as it is, at any https address, and put that address in RETURN_PAGE
  (apps/server/src/mcp.ts). The address has to be exactly the one given to Google.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="robots" content="noindex">
<title>Back to Open Bot</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; --border: #e3e3e8; --button: #1d1d1f; --button-text: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f5f5f7; --muted: #a1a1a6; --bg: #111113; --card: #1c1c1f; --border: #2c2c30; --button: #f5f5f7; --button-text: #111113; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { width: 100%; max-width: 380px; padding: 28px 24px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: var(--muted); }
  a { display: inline-block; padding: 9px 18px; border-radius: 10px; background: var(--button); color: var(--button-text); font-weight: 500; text-decoration: none; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Back to Open Bot</h1>
  <p id="note">Open Bot is finishing the sign-in. You can close this tab once it says it is done.</p>
  <a id="open" href="openbot://sign-in/callback">Open Open Bot</a>
</main>
<script>
  const came = new URLSearchParams(location.search)
  // Only what a sign-in comes back with, so nothing else can be handed to the app this way.
  const back = new URLSearchParams()
  for (const name of ['code', 'state', 'iss', 'scope', 'error', 'error_description']) if (came.has(name)) back.set(name, came.get(name))
  const target = `openbot://sign-in/callback?${back}`
  document.getElementById('open').href = target
  // The code is not left in the address bar or the browser's history.
  history.replaceState(null, '', location.pathname)
  if (!came.has('state')) {
    document.getElementById('title').textContent = 'Nothing to do here'
    document.getElementById('note').textContent = 'This page finishes signing in to Open Bot. Start a sign-in from the app.'
    document.getElementById('open').hidden = true
  } else {
    if (came.has('error')) document.getElementById('note').textContent = 'The sign-in was not completed. Open Bot shows what went wrong.'
    location.replace(target)
  }
</script>
</body>
</html>
