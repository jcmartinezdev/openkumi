# Releases the iPhone app without waiting for Apple where it can (docs/mobile-releases.md).
#
# The app is released with everything else: the release workflow runs this once a release is
# published (release.yml), for the code the release was made from. That code is either sent to
# the phones over the air, in minutes, or, when it changes the native app, built and sent to
# TestFlight. Which of the two is decided by the app's fingerprint: a hash of everything native
# about it. An update over the air only reaches builds with the same fingerprint, so it never
# lands on an app it does not fit.
#
#   - The fingerprint has a finished build: the new JavaScript is published to those phones.
#   - It has none: a build is started and sent to TestFlight.
#
# Run by hand (Actions > Mobile release > Run workflow, choosing the release's tag) it publishes
# an update or starts a build whatever the fingerprint says: to try a failed build again, to send
# an update out again, or to release the app for a release that was published by hand.
#
# It needs the EXPO_TOKEN secret, and does nothing without it.
name: Mobile release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: 'update: send the JavaScript over the air. build: build the app and send it to TestFlight.'
        required: true
        type: choice
        default: update
        options: [update, build]
      message:
        description: What the update is, for the list on expo.dev (update only)
        required: false
        type: string

# One at a time and never cut short, so updates go out in the order the releases were made.
concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - id: token
        name: Is there a token for Expo?
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo ":warning: The EXPO_TOKEN secret is not set, so nothing was published. See docs/mobile-releases.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.present == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - id: fingerprint
        name: Fingerprint of the native app
        if: steps.token.outputs.present == 'true'
        working-directory: apps/mobile
        run: |
          npx expo-updates fingerprint:generate --platform ios > "$RUNNER_TEMP/fingerprint.json"
          hash="$(jq -er '.hash | select(type == "string" and length > 0)' "$RUNNER_TEMP/fingerprint.json")"
          # A fingerprint that left the native packages out would not change when they do, and an
          # update would then reach apps that lack what it needs. Nothing is published from one.
          packages="$(jq '[.sources[] | select(.type == "package" or .type == "dir")] | length' "$RUNNER_TEMP/fingerprint.json")"
          if [ "$packages" -lt 10 ]; then
            echo ":x: The fingerprint covers only $packages native packages. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Send an update, or start a build
        if: steps.token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          HASH: ${{ steps.fingerprint.outputs.hash }}
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -u
          version="$(node -p "require('./app.json').expo.version")"
          message="${MESSAGE:-OpenKumi $version ($(git rev-parse --short=9 HEAD))}"
          update() {
            if eas update --channel production --environment production --platform ios --message "$message" --non-interactive; then
              echo ":white_check_mark: Sent over the air to the apps with fingerprint \`$HASH\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo ":x: The update could not be published (fingerprint \`$HASH\`)." >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }
          build() {
            if eas build --platform ios --profile production --auto-submit --non-interactive --no-wait; then
              echo ":building_construction: $1 A build was started and goes to TestFlight when it is done." >> "$GITHUB_STEP_SUMMARY"
            else
              echo ":x: $1 The build could not be started. See docs/mobile-releases.md for what it needs." >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }
          # Asked for by hand: do just that.
          if [ "$MODE" = update ]; then update; exit; fi
          if [ "$MODE" = build ]; then build "Asked for by hand."; exit; fi

          # A release was made. What happens depends on whether an app with this fingerprint exists.
          builds="$(eas build:list --platform ios --build-profile production --fingerprint-hash "$HASH" --limit 20 --json --non-interactive)"
          count() { jq "[.[] | select($1)] | length" <<<"$builds"; }
          finished="$(count '.status == "FINISHED"')"
          active="$(count '.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS"')"
          errored="$(count '.status == "ERRORED"')"
          if [ "$finished" -gt 0 ]; then
            update
          elif [ "$active" -gt 0 ]; then
            echo ":hourglass: The build for fingerprint \`$HASH\` is still being made, and carries this release when it is done." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$errored" -gt 0 ]; then
            echo ":x: The build for fingerprint \`$HASH\` failed. Start it again by hand: Run workflow, mode build." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            build "The native app changed (fingerprint \`$HASH\` has no build)."
          fi
