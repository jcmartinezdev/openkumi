# Releases OpenKumi. One tag releases everything, in this order:
#
#   git tag v0.0.2 && git push origin v0.0.2
#     1. Check the version and run the tests
#     2. Server: build the archives, then install and start one on each kind of computer
#        Desktop app: build for Mac, Windows and Linux
#     3. Publish the release: desktop app and server      (the GitHub release people download from)
#     4. Release the iPhone app                           (over the air, or a build for TestFlight)
#
# Each step is a job below with that name, and a later one only runs when the ones before it
# passed. Nothing else releases anything: not a merge, not a pull request. How to make the tag is
# in docs/development.md, "Releasing".
#
# A pull request that changes how things are packaged runs steps 1 and 2 as a rehearsal, and
# publishes nothing. The files are kept with the run for a few days.
#
# What it needs, as repository secrets (docs/development.md, "Releasing"):
#   MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD   the Developer ID Application certificate
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   an App Store Connect key, for notarizing
#   EXPO_TOKEN                                             for the iPhone app (docs/mobile-releases.md)
# A release is refused without the first five: a Mac app that is not signed cannot be opened on
# another computer. Without the last, everything but the iPhone app is released.
name: 'Release: desktop app, server and iPhone app'

on:
  push:
    # Any tag that starts with "v". Step 1 refuses one that is not the version the code says.
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/scripts/**
      - apps/server/scripts/**
      - apps/server/bin/**
      - apps/marketing/public/install.sh
      - package-lock.json

# One run for each tag. A rehearsal is given up when its pull request moves on.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---- 1. what is released is what the tests passed on, and the tag is the version the code says
  check:
    name: 1. Check the version and run the tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - id: version
        name: The tag and every part say the same version
        env:
          SIGNING: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        run: |
          stop() { echo "::error::$1"; exit 1; }
          version=$(node -p "require('./apps/server/package.json').version")
          desktop=$(node -p "require('./apps/desktop/package.json').version")
          phone=$(node -p "require('./apps/mobile/app.json').expo.version")
          if [ "$version" != "$desktop" ] || [ "$version" != "$phone" ]; then
            stop "The server says $version, the desktop app $desktop and the iPhone app $phone. Run: npm run bump <version>"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || stop "The tag is $GITHUB_REF_NAME but the code says $version. Delete the tag, run “npm run bump <version>”, commit, and tag that commit."
            [ "$SIGNING" = true ] || stop "A release needs the Mac app signed: set the signing secrets first (docs/development.md, “Releasing”)."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -w @openkumi/server -w @openkumi/client

  # ---- 2. the server as it is installed on its own: one archive for each kind of computer
  server-archives:
    name: '2. Server: build the archives'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node apps/server/scripts/archive.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: server
          path: release/server/
          if-no-files-found: error
          retention-days: 7

  # Installs it the way people do, from a stand-in for the release, and starts it: an archive that
  # does not run on the computers it is for is found here, not by the people who install it.
  server-try:
    name: '2. Server: install and start on ${{ matrix.label }}'
    needs: server-archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM
          - os: macos-latest
            label: Mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            apps/marketing/public/install.sh
            apps/server/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          name: server
          path: served/download/v0.0.0-try
      - name: Install from a stand-in release, start, and ask it who it is
        run: |
          set -eu
          version=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' apps/server/package.json | head -n 1)
          mv served/download/v0.0.0-try "served/download/v$version"
          mkdir -p served/latest/download
          cp "served/download/v$version/openkumi-server.json" served/latest/download/
          (cd served && python3 -m http.server 4380 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          export OPENKUMI_RELEASES_URL=http://127.0.0.1:4380 OPENKUMI_RUNTIME="$RUNNER_TEMP/runtime" OPENKUMI_BIN="$RUNNER_TEMP/bin"
          export OPENKUMI_HOME="$RUNNER_TEMP/home" OPENKUMI_PORT=4391
          sh apps/marketing/public/install.sh --no-service
          [ "$("$OPENKUMI_BIN/openkumi" version)" = "$version" ]
          "$OPENKUMI_BIN/openkumi" start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4391/api/hello > "$RUNNER_TEMP/hello.json" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          grep -q "\"version\":\"$version\"" "$RUNNER_TEMP/hello.json"
          "$OPENKUMI_BIN/openkumi" status
          "$OPENKUMI_BIN/openkumi" update --check

  # ---- 2. the desktop app
  desktop-app:
    name: '2. Desktop app: build for ${{ matrix.label }}'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Mac
            name: mac
            archs: arm64
          - os: windows-latest
            label: Windows
            name: windows
            archs: x64
          - os: ubuntu-latest
            label: Linux
            name: linux
            archs: x64,arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Signing for macOS
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary.p8"
            {
              echo "CSC_LINK=$CERTIFICATE"
              echo "CSC_KEY_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8"
              echo "APPLE_API_KEY_ID=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The signing secrets are not set: the Mac app is built unsigned, and macOS will not open it on another computer."
            echo "OPENKUMI_UNSIGNED=1" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          OPENKUMI_REQUIRE_DICTATION: ${{ runner.os == 'macOS' && '1' || '' }}
      - run: npm run dist -w @openkumi/desktop -- --arch=${{ matrix.archs }}
      - name: Check the Mac app is signed and notarized
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        run: |
          codesign --verify --deep --strict release/mac-arm64/OpenKumi.app
          spctl --assess --type execute --verbose release/mac-arm64/OpenKumi.app
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.name }}
          # Not the uninstaller, which the Windows installer carries inside it and leaves beside itself here.
          path: |
            release/OpenKumi-*
            release/latest*.yml
            !release/*.__uninstaller.exe
          if-no-files-found: error
          retention-days: 7

  # ---- 3. the release people download from: every desktop installer and server archive
  publish-desktop-and-server:
    name: '3. Publish the release: desktop app and server'
    if: github.ref_type == 'tag'
    needs: [check, server-archives, server-try, desktop-app]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/marketing/public/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          cp apps/marketing/public/install.sh files/
          cd files
          # One list of checksums for everything in the release. The server's installer and a
          # server updating itself check their download against it.
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          ls -la
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "OpenKumi $VERSION" --generate-notes -- *

  # ---- 4. the iPhone app, from the same code, once the release is out (docs/mobile-releases.md)
  # It is either sent to the phones over the air, in minutes, or, when the release changes the
  # native app, built and sent to TestFlight. Which of the two is decided by the app's
  # fingerprint, a hash of everything native about it: an update over the air only reaches builds
  # with the same fingerprint, so it never lands on an app it does not fit.
  release-iphone-app:
    name: 4. Release the iPhone app
    if: github.ref_type == 'tag'
    needs: [check, publish-desktop-and-server]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - id: token
        name: Is there a token for Expo?
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo ":warning: The EXPO_TOKEN secret is not set, so the iPhone app was not released. See docs/mobile-releases.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.present == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - name: Send it over the air, or start a build
        if: steps.token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -u
          npx expo-updates fingerprint:generate --platform ios > "$RUNNER_TEMP/fingerprint.json"
          hash="$(jq -er '.hash | select(type == "string" and length > 0)' "$RUNNER_TEMP/fingerprint.json")"
          # A fingerprint that left the native packages out would not change when they do, and an
          # update would then reach apps that lack what it needs. Nothing is published from one.
          packages="$(jq '[.sources[] | select(.type == "package" or .type == "dir")] | length' "$RUNNER_TEMP/fingerprint.json")"
          if [ "$packages" -lt 10 ]; then
            echo ":x: The fingerprint covers only $packages native packages. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # What happens depends on whether an app with this fingerprint has been built.
          builds="$(eas build:list --platform ios --build-profile production --fingerprint-hash "$hash" --limit 20 --json --non-interactive)"
          count() { jq "[.[] | select($1)] | length" <<<"$builds"; }
          if [ "$(count '.status == "FINISHED"')" -gt 0 ]; then
            eas update --channel production --environment production --platform ios --message "OpenKumi $VERSION" --non-interactive
            echo ":white_check_mark: OpenKumi $VERSION was sent to the phones over the air (fingerprint \`$hash\`)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$(count '.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS"')" -gt 0 ]; then
            echo ":hourglass: A build for fingerprint \`$hash\` is still being made. Release the iPhone app by hand once it is done (docs/mobile-releases.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            # None, or one that failed: this release changes the native app, or is the first.
            eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
            echo ":building_construction: This release changes the native app (fingerprint \`$hash\` has no build), so a build was started. It goes to TestFlight when it is done." >> "$GITHUB_STEP_SUMMARY"
          fi
