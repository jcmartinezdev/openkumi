# Makes a release: the desktop app for Mac, Windows and Linux, the server as it is installed on
# its own, and what both read to update themselves. See "Releasing" in the README.
#
#   - Pushing a tag like v0.2.0 builds everything and publishes the release.
#   - A pull request that changes how things are packaged builds everything too, as a rehearsal,
#     and publishes nothing. The files are kept with the run for a few days.
#
# The Mac app is signed and notarized when these secrets are set (README, "Releasing"):
#   MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD   the Developer ID Application certificate
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   an App Store Connect key, for notarizing
# Without them it is still built, but macOS will not open it on another computer, so the release
# is left as a draft for someone to look at.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/scripts/**
      - apps/server/scripts/**
      - apps/server/bin/**
      - apps/marketing/public/install.sh
      - package-lock.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---- what is released is what the tests passed on, and the tag says the version the code says
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: version
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          desktop=$(node -p "require('./apps/desktop/package.json').version")
          [ "$version" = "$desktop" ] || { echo "::error::The server says $version and the desktop app $desktop. Run: npm run bump <version>"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the code says $version. Run: npm run bump <version>, commit, and tag that."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -w @openkumi/server -w @openkumi/client

  # ---- the server as it is installed on its own: one archive for each kind of computer
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node apps/server/scripts/archive.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: server
          path: release/server/
          if-no-files-found: error
          retention-days: 7

  # Installs it the way people do, from a stand-in for the release, and starts it: an archive that
  # does not run on the computers it is for is found here, not by the people who install it.
  server-try:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            apps/marketing/public/install.sh
            apps/server/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          name: server
          path: served/download/v0.0.0-try
      - name: Install from a stand-in release, start, and ask it who it is
        run: |
          set -eu
          version=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' apps/server/package.json | head -n 1)
          mv served/download/v0.0.0-try "served/download/v$version"
          mkdir -p served/latest/download
          cp "served/download/v$version/openkumi-server.json" served/latest/download/
          (cd served && python3 -m http.server 4380 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          export OPENKUMI_RELEASES_URL=http://127.0.0.1:4380 OPENKUMI_RUNTIME="$RUNNER_TEMP/runtime" OPENKUMI_BIN="$RUNNER_TEMP/bin"
          export OPENKUMI_HOME="$RUNNER_TEMP/home" OPENKUMI_PORT=4391
          sh apps/marketing/public/install.sh --no-service
          [ "$("$OPENKUMI_BIN/openkumi" version)" = "$version" ]
          "$OPENKUMI_BIN/openkumi" start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4391/api/hello > "$RUNNER_TEMP/hello.json" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          grep -q "\"version\":\"$version\"" "$RUNNER_TEMP/hello.json"
          "$OPENKUMI_BIN/openkumi" status
          "$OPENKUMI_BIN/openkumi" update --check

  # ---- the desktop app
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            archs: arm64,x64
          - os: windows-latest
            name: windows
            archs: x64
          - os: ubuntu-latest
            name: linux
            archs: x64,arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Signing for macOS
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary.p8"
            {
              echo "CSC_LINK=$CERTIFICATE"
              echo "CSC_KEY_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8"
              echo "APPLE_API_KEY_ID=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The signing secrets are not set: the Mac app is built unsigned, and macOS will not open it on another computer."
            echo "OPENKUMI_UNSIGNED=1" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          OPENKUMI_REQUIRE_DICTATION: ${{ runner.os == 'macOS' && '1' || '' }}
      - run: npm run dist -w @openkumi/desktop -- --arch=${{ matrix.archs }}
      - name: Check the Mac app is signed and notarized
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        run: |
          for app in release/mac-arm64/OpenKumi.app release/mac/OpenKumi.app; do
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute --verbose "$app"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/OpenKumi-*
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  # ---- the release itself
  release:
    if: github.ref_type == 'tag'
    needs: [verify, server, server-try, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/marketing/public/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          # The same question the Mac build asked. Had signing been set up and failed, there would be no build to release.
          MAC_SIGNED: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        run: |
          set -eu
          cp apps/marketing/public/install.sh files/
          cd files
          # One list of checksums for everything in the release. The server's installer and a
          # server updating itself check their download against it.
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          ls -la
          if [ "$MAC_SIGNED" = true ]; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "OpenKumi $VERSION" --generate-notes -- *
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "OpenKumi $VERSION" --generate-notes --draft \
              --notes "The Mac app in this release is not signed: the signing secrets were not set when it was built. It is a draft until someone decides." -- *
          fi
